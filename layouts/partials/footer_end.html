<!--
  Add custom HTML at the end of <body>
-->

<style>
/* Ensure carousel is visible */
.publications-carousel {
  position: relative;
  min-height: 230px;
  margin-bottom: 2rem;
  width: 100%;
  overflow: visible;
  z-index: 1;
}

.carousel-publication-item {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  opacity: 0 !important;
  transition: opacity 0.5s ease-in-out;
  pointer-events: none;
  padding: 2.5rem;
  background: white;
  border-radius: 8px;
  border-left: 4px solid #458588;
  box-sizing: border-box;
  z-index: 1;
}

.carousel-publication-item.active {
  opacity: 1 !important;
  pointer-events: auto;
  z-index: 2;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const carousel = document.querySelector('.publications-carousel');
  if (!carousel) return;

  const items = document.querySelectorAll('.carousel-publication-item');
  const prevBtn = document.querySelector('.carousel-prev');
  const nextBtn = document.querySelector('.carousel-next');

  if (items.length === 0) return;

  let currentIndex = 0;
  let autoplayInterval;

  // Ensure first item is visible immediately
  items[0].classList.add('active');

  function goToSlide(index) {
    items.forEach(item => item.classList.remove('active'));
    items[index].classList.add('active');
    currentIndex = index;
  }

  function nextSlide() {
    const next = (currentIndex + 1) % items.length;
    goToSlide(next);
  }

  function prevSlide() {
    const prev = (currentIndex - 1 + items.length) % items.length;
    goToSlide(prev);
  }

  function startAutoplay() {
    autoplayInterval = setInterval(nextSlide, 10000); // 10 seconds
  }

  // Event listeners
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      clearInterval(autoplayInterval);
      nextSlide();
      startAutoplay();
    });
  }

  if (prevBtn) {
    prevBtn.addEventListener('click', () => {
      clearInterval(autoplayInterval);
      prevSlide();
      startAutoplay();
    });
  }

  // Start autoplay
  goToSlide(0);
  startAutoplay();
});

// Abstract Toggle Functionality
document.addEventListener('DOMContentLoaded', function() {
  const abstractToggles = document.querySelectorAll('.abstract-toggle');
  
  abstractToggles.forEach(toggle => {
    toggle.addEventListener('click', function() {
      const container = this.nextElementSibling;
      if (!container || !container.classList.contains('publication-abstract-container')) {
        return;
      }
      
      const isExpanded = this.classList.contains('expanded');
      
      if (isExpanded) {
        container.style.display = 'none';
        this.classList.remove('expanded');
      } else {
        container.style.display = 'block';
        this.classList.add('expanded');
      }
    });
  });
});

// Publications: topic filter and "Show More"
document.addEventListener('DOMContentLoaded', function() {
  const publicationsList = document.getElementById('publications-list');
  if (!publicationsList) return;

  const PAGE_SIZE = 5;
  const items = Array.from(publicationsList.querySelectorAll('.publication-item'));
  const filterButtons = document.querySelectorAll('.filter-button');
  const loadMoreButton = document.getElementById('load-more-button');
  let topic = '';
  let shown = PAGE_SIZE;

  function render() {
    const matching = items.filter(item => !topic || item.dataset.topics.split(' ').includes(topic));
    items.forEach(item => item.classList.add('hidden'));
    matching.slice(0, shown).forEach(item => item.classList.remove('hidden'));
    if (loadMoreButton) {
      loadMoreButton.parentElement.style.display = matching.length > shown ? '' : 'none';
    }
  }

  filterButtons.forEach(button => {
    button.addEventListener('click', function() {
      topic = this.dataset.topic;
      shown = PAGE_SIZE;
      filterButtons.forEach(b => {
        b.classList.toggle('is-active', b === this);
        b.setAttribute('aria-pressed', b === this ? 'true' : 'false');
      });
      render();
    });
  });

  if (loadMoreButton) {
    loadMoreButton.addEventListener('click', function(e) {
      e.preventDefault();
      shown += PAGE_SIZE;
      render();
    });
  }
});
</script>
